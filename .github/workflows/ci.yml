name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the Node.js major package.json declares
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run unit tests (Vitest)
        run: npm test

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the Node.js major package.json declares
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm install

      # The runner has Chrome installed and playwright.config.ts uses channel: 'chrome': no download.
      # The live GitHub API is read with the workflow's own token, for the repositories the owner
      # selects with the repository variables (spec 049).
      - name: Run E2E tests (Playwright)
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOPIC: ${{ vars.GITHUB_TOPIC }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
